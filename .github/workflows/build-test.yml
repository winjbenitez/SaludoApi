name: Build y Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build y Test - ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar .NET 7
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '7.0.x'

      - name: Restaurar dependencias
        run: dotnet restore SaludoApi.sln

      - name: Compilar
        run: dotnet build SaludoApi.sln --no-restore --configuration Release

      - name: Ejecutar pruebas
        run: dotnet test SaludoApi.sln --no-build --configuration Release